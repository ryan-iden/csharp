name: Publish iden .NET SDK

on:
  push:
    tags:
      - 'iden-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet pack src/Logto.AspNetCore.Authentication/Logto.AspNetCore.Authentication.csproj --configuration Release --output artifacts
      - name: Exchange GitHub OIDC token for a NuGet API key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push 'artifacts/*.nupkg' --api-key '${{ steps.login.outputs.NUGET_API_KEY }}' --source https://api.nuget.org/v3/index.json
