name: Publish iden .NET SDK

on:
  workflow_dispatch:
  push:
    tags:
      - 'iden-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet pack src/Logto.AspNetCore.Authentication/Logto.AspNetCore.Authentication.csproj --configuration Release --output artifacts
      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: iden-nuget-${{ github.sha }}
          path: artifacts/*.nupkg
          if-no-files-found: error
      - name: Exchange GitHub OIDC token for a NuGet API key
        id: login
        uses: NuGet/login@v1
        with:
          user: ryanwong
      - run: dotnet nuget push 'artifacts/*.nupkg' --skip-duplicate --api-key '${{ steps.login.outputs.NUGET_API_KEY }}' --source https://api.nuget.org/v3/index.json
